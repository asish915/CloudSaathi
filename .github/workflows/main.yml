name: CloudSaathi CI-CD DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudsaathi-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # JOB 1: VALIDATE
  # ==========================================
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python backend
        run: |
          python -m py_compile backend/lambda/handler.py

      - name: Terraform format and validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate

      - name: Terraform security scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint


  # ==========================================
  # JOB 2: BUILD
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate

    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://example.invalid' }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: |
          printf 'VITE_API_URL=%s\n' "$VITE_API_URL" > .env.production
          npm run build
          echo "healthy" > dist/health.html
          cd dist
          zip -qr ../dist.zip .

      - name: Package Python Lambda
        run: |
          python -m py_compile backend/lambda/handler.py
          mkdir -p build
          cd backend/lambda
          zip -qr ../../build/lambda.zip .

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudsaathi-build-artifacts
          path: |
            frontend/dist.zip
            build/lambda.zip
          retention-days: 1


  # ==========================================
  # JOB 3: DEPLOY
  # ==========================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs: build

    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
      EC2_INSTANCE_NAME: ${{ secrets.EC2_INSTANCE_NAME }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}

    steps:
      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: cloudsaathi-build-artifacts
          path: .

      - name: Validate deployment configuration
        run: |
          test -n "$AWS_REGION" || (echo "Missing AWS_REGION secret." && exit 1)
          test -n "$PROJECT_NAME" || (echo "Missing PROJECT_NAME secret." && exit 1)
          test -n "$S3_BUCKET" || (echo "Missing S3_BUCKET secret." && exit 1)
          test -n "$LAMBDA_FUNCTION_NAME" || (echo "Missing LAMBDA_FUNCTION_NAME secret." && exit 1)
          test -n "$VITE_API_URL" || (echo "Missing VITE_API_URL secret." && exit 1)
          test -n "${{ secrets.AWS_ROLE_ARN }}" || (echo "Missing AWS_ROLE_ARN secret." && exit 1)

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------
      # Deploy frontend bundle to S3
      # ------------------------------------------
      - name: Upload frontend bundle to S3
        run: |
          aws s3 cp frontend/dist.zip \
            "s3://${S3_BUCKET}/frontend/dist.zip" \
            --region "$AWS_REGION" \
            --sse AES256

      # ------------------------------------------
      # Update Lambda backend
      # ------------------------------------------
      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://build/lambda.zip \
            --region "$AWS_REGION"

          aws lambda wait function-updated-v2 \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --region "$AWS_REGION"

      # ------------------------------------------
      # Deploy frontend to EC2 using SSM
      # ------------------------------------------
      - name: Deploy frontend to EC2 through SSM
        run: |
          INSTANCE_NAME="${EC2_INSTANCE_NAME:-${PROJECT_NAME}-frontend}"

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${INSTANCE_NAME}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId | [0]' \
            --output text \
            --region "$AWS_REGION")

          test -n "$INSTANCE_ID" && test "$INSTANCE_ID" != "None" || \
            (echo "EC2 instance not found: ${INSTANCE_NAME}" && exit 1)

          DEPLOY_COMMAND="set -euo pipefail
          aws s3 cp s3://${S3_BUCKET}/frontend/dist.zip /tmp/cloudsaathi-dist.zip --region ${AWS_REGION}
          sudo mkdir -p /usr/share/nginx/html
          sudo unzip -o /tmp/cloudsaathi-dist.zip -d /usr/share/nginx/html/
          echo healthy | sudo tee /usr/share/nginx/html/health.html >/dev/null
          sudo chown -R nginx:nginx /usr/share/nginx/html
          sudo systemctl enable nginx
          sudo systemctl restart nginx
          curl --fail --silent http://localhost/health.html"

          PARAMETERS=$(jq -nc --arg command "$DEPLOY_COMMAND" '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CloudSaathi deployment ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text \
            --region "$AWS_REGION")

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text \
            --region "$AWS_REGION")

          echo "SSM deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION"
            exit 1
          fi

      # ------------------------------------------
      # Print deployment endpoints
      # ------------------------------------------
      - name: Print deployment endpoints
        run: |
          INSTANCE_NAME="${EC2_INSTANCE_NAME:-${PROJECT_NAME}-frontend}"

          PUBLIC_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${INSTANCE_NAME}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].PublicIpAddress | [0]' \
            --output text \
            --region "$AWS_REGION")

          echo "Frontend: http://${PUBLIC_IP}"
          echo "API base URL: ${VITE_API_URL}"